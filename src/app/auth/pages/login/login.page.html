<ion-content fullscreen class="login-content">
  <div class="login-wrapper">

    <section class="login-card">

      <div class="logo-container">
        <div class="logo-box">
          <img src="assets/logo-escuela.png" alt="Logo escuela" />
        </div>
      </div>

      <div class="login-header">
        <h1>Portal de Padres</h1>
        <p>Escuela Metropolitana La Luz</p>
      </div>

      <form class="login-form" (ngSubmit)="login()">

        <div class="form-group">
          <label>Correo electrónico</label>
          <input
            type="email"
            name="email"
            placeholder="Ingrese su correo"
            [(ngModel)]="email"
            autocomplete="email"
          />
        </div>

        <div class="form-group">
          <label>Contraseña</label>
          <input
            type="password"
            name="password"
            placeholder="Ingrese su contraseña"
            [(ngModel)]="password"
            autocomplete="current-password"
          />
        </div>

        <p class="error-message" *ngIf="errorMessage">
          {{ errorMessage }}
        </p>

        <button class="login-button" type="submit" [disabled]="loading">
          {{ loading ? 'Iniciando sesión...' : 'Iniciar sesión' }}
        </button>

      </form>

      <div class="demo-box">
        <p>Usuario de prueba</p>
        <strong>tutor@example.com</strong>
        <span>Demo_Tutor123!</span>
      </div>

    </section>

  </div>
</ion-content>
