<ion-content fullscreen class="login-content">
  <div class="login-wrapper">

    <div class="logo-section">
      <div class="logo-box">
        <img src="assets/logo-escuela.png" alt="Logo escuela" />
      </div>

      <h1>Escuela Metropolitana La Luz</h1>
      <p>Portal de Padres de Familia</p>
    </div>

    <ion-card class="login-card">
      <ion-card-content>

        <div class="input-group">
          <label>Correo electrónico</label>
          <ion-input
            type="email"
            placeholder="correo@ejemplo.com"
            fill="outline">
          </ion-input>
        </div>

        <div class="input-group">
          <label>Contraseña</label>
          <ion-input
            type="password"
            placeholder="••••••••"
            fill="outline">
          </ion-input>
        </div>

        <ion-button expand="block" class="login-button" routerLink="/dashboard">
          Iniciar sesión
        </ion-button>

        <a class="forgot-password">¿Olvidó su contraseña?</a>

      </ion-card-content>
    </ion-card>

    <p class="help-text">
      ¿Necesita ayuda? Contacte a la escuela al (55) 1234-5678
    </p>

  </div>
</ion-content>
