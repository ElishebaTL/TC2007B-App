<ion-content fullscreen class="comments-content">
  <div class="comments-wrapper">

    <section class="comments-header">
      <ion-menu-button menu="main-menu" class="menu-button"></ion-menu-button>

      <button
        class="back-button"
        [routerLink]="['/report-card-detail', student?.id, reportCard?.id]"
      >
        ← Volver
      </button>

      <div class="header-text">
        <h1>Enviar comentarios</h1>
        <p>{{ reportCard?.termName || 'Boleta' }}</p>
      </div>
    </section>

    <section class="comments-body">

      <div class="select-card">
        <label>Profesor y materia</label>

        <div class="fake-select">
          <span>Comentario general - Todos los profesores</span>
          <span class="arrow">⌄</span>
        </div>
      </div>

      <div class="message-card" *ngFor="let comment of comments">
        <p class="teacher-name">
          {{ comment.teacherName }} · {{ comment.subjectName }}
        </p>

        <p class="message-text">
          {{ comment.message }}
        </p>

        <p class="message-date">
          {{ comment.date }}
        </p>
      </div>

      <div class="message-card" *ngIf="comments.length === 0">
        <p class="teacher-name">Sin comentarios</p>

        <p class="message-text">
          Aún no existen comentarios registrados para esta boleta.
        </p>
      </div>

    </section>

    <div class="comment-input-bar">
      <input
        type="text"
        placeholder="Escriba su comentario o pregunta..."
        [(ngModel)]="newComment"
      />

      <button class="send-button" (click)="sendComment()">
        ➤
      </button>
    </div>

  </div>
</ion-content>
