<ion-content fullscreen class="children-content">
  <div class="children-wrapper">

    <section class="children-header">
      <ion-menu-button menu="main-menu" class="menu-button"></ion-menu-button>

      <button class="back-button" routerLink="/dashboard" type="button">
        <span>←</span>
        <strong>Volver</strong>
      </button>

      <div class="header-text">
        <h1>Mis hijos</h1>
        <p>Seleccione un estudiante para ver el historial de calificaciones</p>
      </div>
    </section>

    <section class="children-list">

      <div
        class="student-card"
        *ngFor="let student of students"
        [routerLink]="['/report-cards', student.id]"
      >
        <div class="student-avatar">👦</div>

        <div class="student-info">
          <h2>{{ student.fullName }}</h2>
          <p>{{ student.grade }}</p>

          <div class="badges-row">
            <span
              class="badge"
              [class.high]="student.performanceLevel === 'Alto'"
              [class.medium]="student.performanceLevel === 'Medio'"
              [class.low]="student.performanceLevel === 'Bajo'"
            >
              <span></span>
              {{ student.performanceLevel }} {{ student.average }}
            </span>

            <span class="badge pending" *ngIf="student.pendingReportCards > 0">
              {{ student.pendingReportCards }} pendiente
            </span>
          </div>
        </div>

        <div class="chevron">›</div>
      </div>

    </section>

  </div>
</ion-content>
