<ion-app>

  <ion-menu menuId="main-menu" contentId="main-content" side="start">
    <ion-content class="menu-content">

      <div class="sidebar-wrapper">

        <section class="sidebar-header">

          <div class="close-row">
            <button class="close-button" type="button" (click)="closeMenu()">
              ×
            </button>
          </div>

          <div class="sidebar-logo">
            <img src="assets/logo-escuela.png" alt="Logo escuela" />
          </div>

          <div class="sidebar-title">
            <h2>Portal de Padres</h2>
            <p>Escuela Metropolitana La Luz</p>
          </div>

        </section>

        <nav class="sidebar-nav">

          <button
            class="menu-option"
            type="button"
            routerLink="/dashboard"
            (click)="closeMenu()"
          >
            <span class="menu-icon">🏠</span>

            <div>
              <h3>Inicio</h3>
              <p>Panel principal</p>
            </div>
          </button>

          <button
            class="menu-option"
            type="button"
            routerLink="/my-children"
            (click)="closeMenu()"
          >
            <span class="menu-icon">👨‍👩‍👧‍👦</span>

            <div>
              <h3>Mis hijos</h3>
              <p>Estudiantes vinculados</p>
            </div>
          </button>

          <button
            class="menu-option"
            type="button"
            routerLink="/report-cards"
            (click)="closeMenu()"
          >
            <span class="menu-icon">📄</span>

            <div>
              <h3>Boletas</h3>
              <p>Calificaciones y firmas</p>
            </div>
          </button>

          <button
            class="menu-option"
            type="button"
            routerLink="/notifications"
            (click)="closeMenu()"
          >
            <span class="menu-icon">🔔</span>

            <div>
              <h3>Notificaciones</h3>
              <p>Avisos escolares</p>
            </div>
          </button>

        </nav>

        <section class="sidebar-footer">

          <button
            class="menu-option logout-option"
            type="button"
            (click)="logout()"
          >
            <span class="menu-icon">⎋</span>

            <div>
              <h3>Cerrar sesión</h3>
              <p>Salir del portal</p>
            </div>
          </button>

        </section>

      </div>

    </ion-content>
  </ion-menu>

  <ion-router-outlet id="main-content"></ion-router-outlet>

</ion-app>
